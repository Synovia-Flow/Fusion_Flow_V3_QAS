# Render blueprint - Fusion Flow V3 QAS (Frankfurt).
# This repo carries TWO portal/API stacks (kept side by side); each has its own
# services below. Deploy the ones you want from the Render Blueprint - having both
# defined here does not force both to run, but a Blueprint sync WILL create every
# service listed. Comment out a block you don't want provisioned.
#
# Stack A - liveWeb single-file portal + Modules jobs (one repo-root Docker image):
#   synovia-flow-3-live   web     the portal + API (gunicorn app:app)         -> Dockerfile CMD
#   ff-worker             worker  drains EXC.Job_Queue (portal /api/enqueue)   always-on
#   ff-cron-ingestion     cron    pull + load raw ENS / sales orders          every 30m, UK business hrs
#   ff-cron-processing    cron    transform + validate staged rows (PRS)      after ingestion
#   ff-cron-mirror        cron    refresh the TSS live mirror (read-back)      hourly
#   ff-cron-ref-choice    cron    refresh TSS choice values                    weekly
#
# Stack B - fusion_api backend + Vite fusion_portal SPA (from dev):
#   fusion-flow-api       web     Integration_Layer/Portal/fusion_api (Docker)
#   fusion-flow-portal    web     Integration_Layer/Portal/fusion_portal (static Vite build)
#
# Stack A submission WRITE jobs (promote/submit/update/cancel) are intentionally NOT
# scheduled - they run per-movement from the portal so a human stays in the loop.
# Stack A DB_* come from the shared env group; DB_PASSWORD is a secret (sync:false).

envVarGroups:
  - name: fusion-db
    envVars:
      - key: DB_SERVER
        sync: false
      - key: DB_NAME
        value: Fusion_Flow_V3_QAS
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_DRIVER
        value: "{ODBC Driver 18 for SQL Server}"
      - key: DB_ENCRYPT
        value: "yes"
      - key: DB_TRUST
        value: "no"

services:
  # ======================================================================
  # STACK A - liveWeb portal + Modules jobs
  # ======================================================================

  # --- Web: the live portal + API ------------------------------------------
  - type: web
    name: synovia-flow-3-live
    runtime: docker
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - fromGroup: fusion-db
      # Portal action/enqueue buttons run real jobs/TSS calls - OFF by default.
      # Set to 1 to let the portal trigger promote/submit/update/cancel/reprocess.
      - key: PORTAL_ACTIONS_ENABLED
        value: "0"

  # --- Background worker: drains the job queue ------------------------------
  - type: worker
    name: ff-worker
    runtime: docker
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python Modules/Global/job_worker.py
    envVars:
      - fromGroup: fusion-db
      - key: WORKER_POLL_SECONDS
        value: "10"

  # --- Cron: ingestion cycle (pull + load raw) -----------------------------
  # Every 30 min during UK business hours. Schedule is UTC (05-19 UTC ~ 06-20 BST).
  - type: cron
    name: ff-cron-ingestion
    runtime: docker
    region: frankfurt
    schedule: "*/30 5-19 * * 1-5"
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python Modules/Ingestion/run_ingestion.py
    envVars:
      - fromGroup: fusion-db

  # --- Cron: processing engine (transform + validate) ----------------------
  - type: cron
    name: ff-cron-processing
    runtime: docker
    region: frankfurt
    schedule: "10,40 5-19 * * 1-5"
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python Modules/Processing/process_engine.py
    envVars:
      - fromGroup: fusion-db

  # --- Cron: refresh the TSS live mirror (read-back, all live movements) ----
  - type: cron
    name: ff-cron-mirror
    runtime: docker
    region: frankfurt
    schedule: "0 * * * *"
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python Modules/Submission/mirror_ens.py
    envVars:
      - fromGroup: fusion-db

  # --- Cron: refresh TSS choice values (reference data) ---------------------
  - type: cron
    name: ff-cron-ref-choice
    runtime: docker
    region: frankfurt
    schedule: "0 3 * * 1"
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python Modules/Global/fetch_choice_values.py
    envVars:
      - fromGroup: fusion-db

  # ======================================================================
  # STACK B - fusion_api backend + Vite fusion_portal SPA (from dev)
  # Azure can be re-enabled later with a GitHub Actions workflow.
  # ======================================================================
  - type: web
    name: fusion-flow-api
    runtime: docker
    dockerfilePath: Integration_Layer/Portal/fusion_api/Dockerfile
    dockerContext: Integration_Layer/Portal/fusion_api
    healthCheckPath: /api/health
    envVars:
      - key: DB_CONN_STR
        sync: false
      - key: FLOW_V1_USER
        sync: false
      - key: FLOW_V1_PASSWORD
        sync: false
      - key: FUSION_PORTAL_CORS_ORIGINS
        value: https://fusion-flow-portal.onrender.com

  - type: web
    name: fusion-flow-portal
    runtime: static
    rootDir: Integration_Layer/Portal/fusion_portal
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://fusion-flow-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
